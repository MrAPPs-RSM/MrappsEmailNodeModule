name: Release & Delivery

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check sources and tests
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build the project
        run: npm run build


  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Remove legacy npm config
        run: |
          rm -f .npmrc
          npm config delete always-auth || true

      - name: Build the project
        run: npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Debug versions
        run: |
          echo "RELEASE_VERSION: ${RELEASE_VERSION}"
          echo "Local package.json version:"
          node -p "require('./package.json').version"
          echo "Published npm version:"
          npm view @mrapps-rsm/mrappsemailnodemodule version --registry=https://registry.npmjs.org

      - name: Publish package to npm with Trusted Publishing
        if: env.release_status == 'released'
        run: npm publish --access public